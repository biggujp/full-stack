<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - BaanSaiJai</title>
   <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
   <style>
   *{box-sizing:border-box;margin:0;padding:0}
   body{
       font-family:'Press Start 2P', cursive;
       min-height:100vh;
       display:flex;
       justify-content:center;
       align-items:center;
       overflow:hidden;
       background:
           radial-gradient(circle at center,
           #3f1d78 0%,
           #0b1025 70%);
       color:#fff;
   }

   /* Stars */
   .stars{position:fixed;width:100%;height:100%;overflow:hidden}
   .star{position:absolute;width:4px;height:4px;background:#fff;box-shadow:0 0 8px #fff;animation:blink 2s infinite alternate}
   @keyframes blink{from{opacity:.2}to{opacity:1}}

   /* Moon */
   .moon{position:absolute;top:60px;right:90px;width:80px;height:80px;background:#ffd166;border-radius:50%;box-shadow:0 0 40px #ffd166}
   .moon:before{content:"";position:absolute;width:65px;height:65px;background:#0b1025;border-radius:50%;left:20px;top:0}

   /* Card */
   .card{position:relative;text-align:center;padding:40px 36px;background:#10172e;border:6px solid #4d68ff;box-shadow:0 0 0 6px #1b2552,0 20px 50px rgba(0,0,0,.5);z-index:2;width:min(720px,92%)}

   .title{font-size:34px;line-height:1.2;background:linear-gradient(#ffd966,#ff9f1c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:6px 6px #000;margin-bottom:18px}
   .subtitle{color:#9be7ff;font-size:12px;margin-bottom:18px}

   .profile-top{display:flex;align-items:center;gap:20px;justify-content:center;margin-bottom:18px}
   .avatar{width:140px;height:140px;border-radius:12px;object-fit:cover;border:4px solid #fff;box-shadow:6px 6px #000}
   .meta{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
   .name{font-size:18px;color:#ffd966}
   .username{color:#9be7ff;font-size:12px}

   .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
   .info-card{background:#0b1125;padding:14px;border:3px solid #2b2f6b;border-radius:8px;text-align:left}
   .info-label{font-size:10px;color:#91e5ff;display:block;margin-bottom:6px}
   .info-value{font-size:12px;color:#fff}

   .btn-group{display:flex;gap:12px;margin-top:18px}
   .btn{flex:1;padding:12px 10px;text-decoration:none;color:#fff;border:4px solid #fff;box-shadow:6px 6px #000;font-size:12px}
   .btn-outline{background:#10172e}
   .btn-logout{background:#ff4f81}

   .ground{position:absolute;bottom:0;width:100%;height:90px;background:repeating-linear-gradient(90deg,#2d6a4f 0 20px,#40916c 20px 40px);border-top:6px solid #95d5b2}

   @media(max-width:768px){
       .card{padding:30px 20px}
       .title{font-size:22px}
       .avatar{width:100px;height:100px}
       .info-grid{grid-template-columns:1fr}
       .name{font-size:14px}
   }
   </style>
</head>
<body>

<div class="stars">
    <div class="star" style="top:10%;left:15%"></div>
    <div class="star" style="top:20%;left:70%"></div>
    <div class="star" style="top:30%;left:40%"></div>
    <div class="star" style="top:50%;left:80%"></div>
    <div class="star" style="top:70%;left:20%"></div>
    <div class="star" style="top:80%;left:60%"></div>
    <div class="star" style="top:15%;left:90%"></div>
    <div class="star" style="top:60%;left:10%"></div>
 </div>

<div class="moon"></div>

<div class="card">
    <div class="title">PROFILE</div>   

    <div class="profile-top">
        {% if member.avatar %}
            <img src="{{ member.avatar.url }}" class="avatar" alt="Avatar">
        {% else %}
            <img src="https://www.gravatar.com/avatar/?s=240&d=identicon" class="avatar" alt="Avatar">
        {% endif %}

        <div class="meta">
            <div class="name">{{ member.name|default:"ยังไม่ได้ตั้งชื่อ" }}</div>
            <div class="username">@{{ member.user }}</div>
            <div style="margin-top:6px;font-size:10px;color:#91e5ff">คะแนน: {{ member.point }}</div>
        </div>
    </div>

    <div class="info-grid">
        <div class="info-card">
            <span class="info-label">อีเมล</span>
            <div class="info-value">{{ member.email|default:"-" }}</div>
        </div>
        <div class="info-card">
            <span class="info-label">เว็บไซต์</span>
            <div class="info-value">{{ member.website|default:"-" }}</div>
        </div>
        <div class="info-card" style="grid-column:1 / -1">
            <span class="info-label">คำอธิบายตัวเอง (Bio)</span>
            <div class="info-value">{{ member.bio|default:"-" }}</div>
        </div>
    </div>

    <div class="btn-group">
        <a href="{% url 'home' %}" class="btn btn-outline">กลับหน้าหลัก</a>
        <a href="{% url 'logout' %}" class="btn btn-logout">ออกจากระบบ</a>
    </div>

</div>

<div class="ground"></div>

</body>
</html>
