<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายการสินค้า</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', Tahoma, sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at center,
        #4a2c8a 0%,
        #0b1025 75%);
    color:white;
    padding:50px 20px;
}

.stars{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
}

.star{
    position:absolute;
    width:4px;
    height:4px;
    background:#fff;
    box-shadow:0 0 10px #fff;
    animation:blink 2s infinite alternate;
}

@keyframes blink{
    from{opacity:.2;}
    to{opacity:1;}
}

.container{
    max-width:1200px;
    margin:auto;
    position:relative;
    z-index:10;
}

.title{
    font-family:'Press Start 2P', cursive;
    font-size:42px;
    text-align:center;
    margin-bottom:50px;
    line-height:1.5;
    background:
        linear-gradient(#ffd166,#ff9f1c);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:5px 5px #000;
}

.row{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(300px,1fr));
    gap:30px;
}

.card{
    background:#10172e;
    border:4px solid #4d68ff;
    box-shadow:
        0 0 0 4px #1b2552,
        8px 8px #000;
    overflow:hidden;
    transition:.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card-body{
    padding:25px;
}

.card-title{
    font-family:'Press Start 2P', cursive;
    font-size:14px;
    color:#ffd166;
    line-height:1.8;
    margin-bottom:20px;
}

.card-text{
    color:#d7f3ff;
    line-height:1.8;
    margin-bottom:20px;
}

.price{
    font-size:24px;
    color:#95ff9c;
    font-weight:bold;
}

.btn{
    display:block;
    text-decoration:none;
    text-align:center;
    margin:20px;
    padding:15px;
    background:#5fa8ff;
    color:white;
    font-weight:bold;
    border:3px solid white;
    box-shadow:4px 4px #000;
    transition:.2s;
}

.btn:hover{
    background:#80ed99;
    color:#000;
}

.empty{
    text-align:center;
    font-size:22px;
    color:#ffd166;
}

.ground{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:80px;
    background:
        repeating-linear-gradient(
            90deg,
            #2d6a4f 0 20px,
            #40916c 20px 40px
        );
    border-top:6px solid #95d5b2;
}

@media(max-width:768px){

    .title{
        font-size:28px;
    }

    .card-title{
        font-size:12px;
    }
}
</style>
</head>
<body>

<div class="stars">
    <div class="star" style="top:10%;left:15%"></div>
    <div class="star" style="top:20%;left:75%"></div>
    <div class="star" style="top:30%;left:40%"></div>
    <div class="star" style="top:50%;left:90%"></div>
    <div class="star" style="top:70%;left:20%"></div>
    <div class="star" style="top:80%;left:60%"></div>
</div>

<div class="container">

    <div class="title">
        SERVICE AND PRODUCT LISTS
    </div>

    <div class="row">
        <!-- ===== Product Grid ===== -->
        <div class="products-grid">

            {% for item in products %}
            <div class="product-card">

                <!-- รูปสินค้า -->
                <div class="image-box">
                    {% if item.image %}
                        <img src="{{ item.image.url }}" alt="{{ item.title }}">
                    {% else %}
                        <img src="https://via.placeholder.com/300x300?text=No+Image"
                            alt="No Image">
                    {% endif %}
                </div>

                <!-- ข้อมูลสินค้า -->
                <div class="card-body">

                    <div class="product-title">
                        {{ item.title|truncatechars:25 }}
                    </div>

                    <div class="price">
                        {{ item.price }} บาท
                    </div>

                    <a href="{% url 'product_detail' item.id %}"
                    class="btn-detail">
                        ดูรายละเอียด
                    </a>

                </div>

            </div>

            {% empty %}
            <div class="empty">
                ยังไม่มีสินค้าในระบบ
            </div>
            {% endfor %}

        </div>

        <style>
        /* ===== Product Grid ===== */
        .products-grid{
            display:grid;
            grid-template-columns:repeat(6, minmax(180px, 1fr));
            gap:20px;
            margin-top:40px;
            position:relative;
            z-index:10;
        }

        /* ===== Product Card ===== */
        .product-card{
            background:#10172e;
            border:3px solid #4d68ff;
            border-radius:15px;
            overflow:hidden;
            box-shadow:
                0 0 0 3px #1b2552,
                6px 6px #000;
            transition:all .3s ease;
        }

        .product-card:hover{
            transform:translateY(-8px);
        }

        /* ===== Image ===== */
        .image-box{
            width:100%;
            aspect-ratio:1/1;
            background:#0b1125;
            overflow:hidden;
        }

        .image-box img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
            transition:.3s;
        }

        .product-card:hover img{
            transform:scale(1.08);
        }

        /* ===== Body ===== */
        .card-body{
            padding:15px;
            text-align:center;
        }

        .product-title{
            font-family:'Press Start 2P', cursive;
            font-size:12px;
            color:#ffd166;
            line-height:1.7;
            min-height:50px;
            margin-bottom:15px;
        }

        .price{
            color:#80ed99;
            font-size:18px;
            font-weight:bold;
            margin-bottom:15px;
        }

        /* ===== Button ===== */
        .btn-detail{
            display:block;
            text-decoration:none;
            padding:10px;
            background:#5fa8ff;
            color:#fff;
            border:2px solid #fff;
            border-radius:10px;
            font-size:14px;
            font-weight:bold;
            transition:.25s;
        }

        .btn-detail:hover{
            background:#80ed99;
            color:#000;
        }

        /* ===== Empty ===== */
        .empty{
            grid-column:1 / -1;
            text-align:center;
            color:#ffd166;
            font-size:24px;
            margin-top:50px;
        }

        /* ===== Tablet ===== */
        @media (max-width:1400px){
            .products-grid{
                grid-template-columns:repeat(4, 1fr);
            }
        }

        /* ===== Mobile ===== */
        @media (max-width:768px){
            .products-grid{
                grid-template-columns:repeat(2, 1fr);
            }

            .product-title{
                font-size:10px;
            }

            .price{
                font-size:16px;
            }

            .btn-detail{
                font-size:12px;
            }
        }
        </style>      
    </div>

</div>

<div class="ground"></div>

</body>
</html>
