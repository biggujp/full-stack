<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World Pixel Art</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Press Start 2P', cursive;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
        radial-gradient(circle at center, #3f1d78 0%, #0b1025 70%);
}

/* Stars */
.stars{
    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
}

.star{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    box-shadow:0 0 8px white;
    animation:blink 2s infinite alternate;
}

@keyframes blink{
    from{opacity:0.2}
    to{opacity:1}
}

/* Main Card */
.card{
    position:relative;
    text-align:center;
    padding:50px 40px;
    background:#10172e;
    border:6px solid #4d68ff;
    box-shadow:
        0 0 0 6px #1b2552,
        0 20px 50px rgba(0,0,0,.5);
    image-rendering:pixelated;
    z-index:2;
}

/* Pixel Title */
.title{
    font-size:42px;
    line-height:1.4;
    background:linear-gradient(#ffd966,#ff9f1c);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:
        6px 6px #000;
    animation:float 2s ease-in-out infinite;
}

.subtitle{
    margin-top:30px;
    color:#9be7ff;
    font-size:14px;
    line-height:1.8;
}

/* Start Button */
.btn{
    display:inline-block;
    margin-top:40px;
    padding:18px 28px;
    text-decoration:none;
    color:#fff;
    background:#ff4f81;
    border:4px solid #fff;
    box-shadow:6px 6px #000;
    transition:.15s;
}

.btn:hover{
    transform:translate(4px,4px);
    box-shadow:2px 2px #000;
}

/* Floating */
@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

/* Pixel Moon */
.moon{
    position:absolute;
    top:80px;
    right:120px;
    width:80px;
    height:80px;
    background:#ffd166;
    border-radius:50%;
    box-shadow:0 0 40px #ffd166;
}

.moon:before{
    content:"";
    position:absolute;
    width:65px;
    height:65px;
    background:#0b1025;
    border-radius:50%;
    left:20px;
    top:0;
}

/* Ground */
.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:90px;
    background:
    repeating-linear-gradient(
        90deg,
        #2d6a4f 0 20px,
        #40916c 20px 40px
    );
    border-top:6px solid #95d5b2;
}
</style>
</head>
<body>

<div class="stars">
    <div class="star" style="top:10%;left:15%"></div>
    <div class="star" style="top:20%;left:70%"></div>
    <div class="star" style="top:30%;left:40%"></div>
    <div class="star" style="top:50%;left:80%"></div>
    <div class="star" style="top:70%;left:20%"></div>
    <div class="star" style="top:80%;left:60%"></div>
    <div class="star" style="top:15%;left:90%"></div>
    <div class="star" style="top:60%;left:10%"></div>
</div>

<div class="moon"></div>

<div class="card">
    <div class="title">
        HELLO<br>
        WORLD!
    </div>

    <div class="subtitle">
        > Welcome to my pixel world!<br><br>
        BaanSaiJai^_^
    </div>

    <a href="#" class="btn">
        START GAME
    </a>
</div>

<div class="ground"></div>

</body>
</html>
