<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - BaanSaiJai</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Press Start 2P', cursive;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
        radial-gradient(circle at center,
        #3f1d78 0%,
        #0b1025 70%);
}

/* ===== Navbar ===== */
.nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:12px}
.nav a{font-family:'Press Start 2P',cursive;text-decoration:none;color:#fff;padding:10px 14px;background:#10172e;border:4px solid #fff;box-shadow:4px 4px #000;border-radius:6px;font-size:12px}
.nav a:hover{transform:translateY(-3px);background:#4d96ff}

/* ===== Stars ===== */
.stars{
    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
}

.star{
    position:absolute;
    width:4px;
    height:4px;
    background:#fff;
    box-shadow:0 0 8px #fff;
    animation:blink 2s infinite alternate;
}

@keyframes blink{
    from{opacity:0.2;}
    to{opacity:1;}
}

/* ===== Moon ===== */
.moon{
    position:absolute;
    top:80px;
    right:120px;
    width:80px;
    height:80px;
    background:#ffd166;
    border-radius:50%;
    box-shadow:0 0 40px #ffd166;
}

.moon:before{
    content:"";
    position:absolute;
    width:65px;
    height:65px;
    background:#0b1025;
    border-radius:50%;
    left:20px;
    top:0;
}

/* ===== Main Card ===== */
.card{
    position:relative;
    text-align:center;
    padding:50px 40px;
    background:#10172e;
    border:6px solid #4d68ff;
    box-shadow:
        0 0 0 6px #1b2552,
        0 20px 50px rgba(0,0,0,.5);
    z-index:2;
    width:min(700px,90%);
}

/* ===== Title ===== */
.title{
    font-size:42px;
    line-height:1.4;
    background:
        linear-gradient(#ffd966,#ff9f1c);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:6px 6px #000;
    animation:float 2s ease-in-out infinite;
}

.subtitle{
    margin-top:30px;
    color:#9be7ff;
    font-size:14px;
    line-height:1.8;
}

/* ===== Animation ===== */
@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

/* ===== Menu ===== */
.menu{
    margin-top:45px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

/* ===== Buttons ===== */
.btn{
    display:block;
    padding:18px 25px;
    text-decoration:none;
    color:#fff;
    border:4px solid #fff;
    box-shadow:6px 6px #000;
    transition:.15s;
    font-size:14px;
}

.btn:hover{
    transform:translate(4px,4px);
    box-shadow:2px 2px #000;
}

.btn-report{
    background:#ff4f81;
}

.btn-services{
    background:#4d96ff;
}

.btn-about{
    background:#06d6a0;
}

/* ===== Ground ===== */
.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:90px;
    background:
    repeating-linear-gradient(
        90deg,
        #2d6a4f 0 20px,
        #40916c 20px 40px
    );
    border-top:6px solid #95d5b2;
}

/* ===== Mobile ===== */
@media(max-width:768px){

    .card{
        padding:40px 25px;
    }

    .title{
        font-size:28px;
    }

    .subtitle{
        font-size:12px;
    }

    .btn{
        font-size:12px;
        padding:16px;
    }

    .moon{
        width:60px;
        height:60px;
        top:40px;
        right:40px;
    }

    .moon:before{
        width:50px;
        height:50px;
    }
}
</style>

</head>
<body>

<!-- Stars -->

<!-- Navbar -->
<nav class="nav">
    <a href="{% url 'home' %}">HOME</a>
    <a href="{% url 'all_products' %}">SERVICES</a>
    <a href="{% url 'about' %}">ABOUT</a>
    {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">PROFILE</a>
    {% else %}
        <a href="{% url 'login' %}">LOGIN</a>
        <a href="{% url 'register' %}">REGISTER</a>
    {% endif %}
</nav>

<div class="stars">
    <div class="star" style="top:10%;left:15%"></div>
    <div class="star" style="top:20%;left:70%"></div>
    <div class="star" style="top:30%;left:40%"></div>
    <div class="star" style="top:50%;left:80%"></div>
    <div class="star" style="top:70%;left:20%"></div>
    <div class="star" style="top:80%;left:60%"></div>
    <div class="star" style="top:15%;left:90%"></div>
    <div class="star" style="top:60%;left:10%"></div>
</div>

<!-- Moon -->

<div class="moon"></div>

<!-- Main Card -->

<div class="card">


<div class="title">
    BAAN<br>
    SAI JAI
</div>

<div class="subtitle">
    > Welcome to my pixel world!<br><br>
    Incident Management System
</div>

<div class="menu">

    <a href="/incident-report/"
       class="btn btn-report">
        📢 INCIDENT REPORT
    </a>

    <a href="/products/"
       class="btn btn-services">
        🛒 SERVICES
    </a>

    <a href="/about/"
       class="btn btn-about">
        ℹ️ ABOUT US
    </a>

</div>


</div>

<!-- Ground -->

<div class="ground"></div>

</body>
</html>
