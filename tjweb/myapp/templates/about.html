<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>About Me</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background: linear-gradient(135deg, #1f4037, #99f2c8);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      color: #333;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      animation: fadeIn 1s ease;
    }

    h1 {
      font-weight: 600;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 20px;
    }

    .badge-skill {
      margin: 5px;
      padding: 8px 15px;
      border-radius: 50px;
      background: #eee;
      display: inline-block;
      font-size: 14px;
    }

    .btn-funny {
      margin-top: 20px;
      border-radius: 50px;
      padding: 10px 20px;
      border: none;
      background: #1f4037;
      color: white;
      transition: 0.3s;
    }

    .btn-funny:hover {
      background: #16322b;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>👨‍💻 About Me</h1>
    <div class="subtitle">วิศวกรกากๆ แต่พยายามอยู่ 😅</div>

    <p>
      สวัสดีครับ ผมคือวิศวกรสายงงๆ  
      Debug ก็ไม่เก่ง แต่ Google เก่งมาก  
      Stack Overflow คือเพื่อนแท้ 🤝
    </p>

    <p>
      เขียนโค้ดทีไร Bug มาเองตลอด  
      แต่ก็ยังสู้ต่อ เพราะชีวิตมันต้อง deploy 🚀
    </p>

    <div>
      <span class="badge-skill">HTML พอได้</span>
      <span class="badge-skill">CSS งงๆ</span>
      <span class="badge-skill">JavaScript เดาๆ</span>
      <span class="badge-skill">Debug ด้วยใจ</span>
    </div>

    <button class="btn btn-funny" onclick="motivate()">
      กดเพื่อกำลังใจ
    </button>
  </div>

  <script>
    function motivate() {
      const msgs = [
        "ไม่เป็นไร ทุกคนก็เคยกากมาก่อน 😆",
        "Bug คือเพื่อน ไม่ใช่ศัตรู",
        "โค้ดพัง = ประสบการณ์เพิ่ม",
        "อย่างน้อยมันก็ compile... บางครั้ง 😅",
        "อย่ายอมแพ้! Stack Overflow ยังอยู่กับคุณ"
      ];
      alert(msgs[Math.floor(Math.random() * msgs.length)]);
    }
  </script>

</body>
</html>
